version: "3"
services:
  explorer-model:
    container_name: explorer-model
    image: tecokit/edge-ml_model:latest
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    restart: always
    volumes:
      - .env:/app/.env:ro
    build: ./ml
    ports:
      - "3003:3003"
    networks:
      - backbone
  explorer-backend:
    container_name: explorer-backend
    image: tecokit/edge-ml_backend:latest
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    restart: always
    build: ./backend
    volumes:
      - .env:/app/.env:ro
    ports:
      - "3001:3001"
    links:
      - mongo
    depends_on: 
      - explorer-authentication
      - rabbitmq
    networks:
      - backbone
  explorer-authentication:
    container_name: explorer-authentication
    image: tecokit/edge-ml_authentication:latest
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    restart: always
    build: ./authentication
    volumes:
      - .env:/app/.env:ro
    ports:
      - "3002:3002"
    links:
      - mongo
    networks:
      - backbone
  explorer-frontend:
    container_name: explorer-frontend
    image: tecokit/edge-ml_frontend:latest
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      - NODE_ENV=production
    build: ./frontend
    restart: always
    links:
     - explorer-authentication
     - explorer-backend
    depends_on: 
      - explorer-backend
      - explorer-authentication
      - dataset-store
      - explorer-model
    networks:
      - backbone
  dataset-store:
    container_name: dataset-store
    image: tecokit/edge-ml_dataset-store:latest
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    build: ./Dataset-store
    restart: always
    ports:
      - 3004:3004
    volumes:
      - ./tsData:/app/app/DATA
      - ./rawCSVDATA:/app/app/RAW_UPLOAD_DATA
      - .env:/app/app/.env:ro
      - ./logs/dataset-store:/app/logs
    networks:
      - backbone
    links:
      - mongo
  mongo:
    container_name: mongo
    restart: always
    image: mongo:4
    volumes:
      - ./data:/data/db
    ports:
      - "27017:27017"
    environment:
      - NETWORK_ACCESS=internal
    networks:
      - backbone
  rabbitmq:
    container_name: 'rabbitmq'
    restart: always
    image: rabbitmq:3-management-alpine
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq/
      - rabbitmq_log:/var/log/rabbitmq/
    networks:
      - backbone
  arduino-compiler:
    container_name: arduino-compiler
    build: ./firmwareCompile
    restart: always
    ports:
      - 3005:3005
    networks:
      - backbone
  watchtower:
    container_name: watchtower
    image: containrrr/watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_POLL_INTERVAL=60
      - WATCHTOWER_CLEANUP=true
    networks:
      - backbone
  caddy:
    container_name: caddy
    image: caddy:2.8.4-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - ACME_EMAIL=explorer@teco.edu
      - CADDY_PUBLIC_HOST=app.edge-ml.org
      - CADDY_INTERNAL_HOST=explorer.dmz.teco.edu
      # First deploy / config testing: point at LE staging to avoid rate limits
      # (browser shows untrusted — expected), then remove this line and recreate:
      # - ACME_CA=https://acme-staging-v02.api.letsencrypt.org/directory
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docs:/srv/docs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - explorer-frontend
      - explorer-backend
      - explorer-authentication
      - dataset-store
      - explorer-model
      - arduino-compiler
    networks:
      - backbone
volumes:
  caddy_data:
  caddy_config:
  rabbitmq_data:
  rabbitmq_log:
networks:
  backbone:
    driver: bridge
